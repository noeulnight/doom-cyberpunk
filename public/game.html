<!doctype html><html lang="en"><head><meta charset="utf-8"><title>Talia doom</title><style>html,body{margin:0;background:#000;width:100%;height:100%;overflow:hidden}canvas{display:block;width:100%!important;height:100%!important;image-rendering:pixelated;outline:0}</style></head><body><canvas id="screen" width="320" height="200" tabindex="0"></canvas><script src="vendor/js-dos.js"></script><script>
const screen=document.getElementById('screen');
function report(type){parent.postMessage({type},location.origin);}
window.addEventListener('error',()=>report('error'));
window.addEventListener('unhandledrejection',()=>report('error'));
Dos(screen,{wdosboxUrl:'vendor/wdosbox.js',autolock:false,onerror:()=>report('error')}).ready((fs,main)=>{
 fs.extract('doom.zip').then(()=>main(['-c','DOOM.EXE -warp 1 1 -skill 2'])).then(()=>{
  screen.focus();report('ready');
 }).catch(()=>report('error'));
});
</script></body></html>
